name: faultlog-ops

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: faultlogs
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    # Healthy only once the init script has created the schema (pg_isready
    # alone reports ready while the preload is still running).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U ops -d faultlogs
          && psql -U ops -d faultlogs -c 'SELECT 1 FROM index_build_jobs LIMIT 0' >/dev/null 2>&1
      interval: 3s
      timeout: 5s
      retries: 100
    ports:
      - "5433:5432"

  api1: &api
    build: .
    environment:
      DATABASE_URL: postgresql://ops:ops@db:5432/faultlogs
      ORPHAN_GRACE_SECONDS: "15"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s
    ports:
      - "8001:8000"

  api2:
    <<: *api
    ports:
      - "8002:8000"

volumes:
  pgdata:
